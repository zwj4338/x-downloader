
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>X Downloader</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101522;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 padding:24px 16px;
}
.container{max-width:520px;margin:auto}
header{text-align:center;margin:35px 0}
.logo{font-size:46px}
h1{font-size:28px;margin:10px}
.sub{color:#9ca3af;font-size:14px}
.panel{
 background:#1c2638;
 border-radius:18px;
 padding:20px;
 margin-top:22px;
}
input,select{
 width:100%;
 padding:15px;
 border-radius:12px;
 border:1px solid #3b4659;
 background:#101522;
 color:white;
 font-size:15px;
 outline:none;
}
select{margin-top:8px}
button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:12px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 background:#7564ee;
 color:white;
 margin-top:14px;
}
button:disabled{opacity:.5}
#status{
 color:#c4b5fd;
 margin-top:15px;
 font-size:14px;
}
.item{
 background:#263248;
 border-radius:12px;
 padding:12px;
 margin-top:15px;
 overflow:hidden;
}
.item video,.item img{
 width:100%;
 display:block;
 border-radius:10px;
 background:#000;
}
.item video{
 aspect-ratio:9/16;
 object-fit:contain;
}
.action{
 display:block;
 width:100%;
 text-align:center;
 text-decoration:none;
 border-radius:10px;
 padding:13px;
 margin-top:12px;
 background:#7564ee;
 color:white;
 font-weight:bold;
 border:0;
}
.download{background:#35445e}
.small{color:#9ca3af;font-size:12px}
.error{color:#fca5a5;font-size:13px}
.quality-box{
 background:#1c2638;
 border-radius:12px;
 padding:13px;
 margin-top:13px;
}
.quality-title{
 font-size:13px;
 color:#c4b5fd;
 font-weight:bold;
}
.quality-hint{
 color:#9ca3af;
 font-size:11px;
 margin-top:6px;
}
.quality-badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:7px;
 background:#3d356d;
 color:#d8d0ff;
 font-size:11px;
 margin-left:6px;
}
footer{
 text-align:center;
 color:#697386;
 margin-top:35px;
 font-size:12px;
}
</style>
</head>

<body>
<div class="container">

<header>
 <div class="logo">𝕏 ↓</div>
 <h1>X Downloader</h1>
 <div class="sub">Twitter / X 图片和视频解析工具</div>
</header>

<div class="panel">
 <h3>粘贴推文链接</h3>
 <input id="tweetUrl"
  placeholder="https://x.com/user/status/123456789">
 <button id="parseBtn" onclick="parseTweet()">开始解析</button>
 <div id="status">支持公开推文链接</div>
</div>

<div id="results"></div>

<div class="panel">
 <h3>最近解析</h3>
 <div id="history" class="small">暂无历史记录</div>
</div>

<footer>
仅用于下载自己拥有或获准使用的媒体内容
</footer>

</div>

<script>
const API_URL="https://x-media-api.zwj4338.workers.dev";

const input=document.getElementById("tweetUrl");
const statusBox=document.getElementById("status");
const results=document.getElementById("results");
const btn=document.getElementById("parseBtn");

function getTweetId(url){
 const match=url.match(/status\/(\d+)/);
 return match?match[1]:null;
}

function showError(card,message){
 const p=document.createElement("p");
 p.className="error";
 p.textContent=message;
 card.appendChild(p);
}

function addButton(card,url,text,download=false){
 const a=document.createElement("a");
 a.href=url;
 a.target="_blank";
 a.rel="noopener noreferrer";
 a.className="action"+(download?" download":"");
 a.textContent=text;

 if(download){
  a.download="x-video.mp4";
 }

 card.appendChild(a);
 return a;
}

// 画质名称
function qualityName(q){
 if(q.label)return q.label;

 const longest=Math.max(
  Number(q.width)||0,
  Number(q.height)||0
 );

 if(longest>=3000)return "4K";
 if(longest>=2000)return "2K";
 if(longest>=1800)return "1080P";
 if(longest>=1100)return "720P";
 if(longest>=700)return "480P";

 return longest?longest+"P":"原始画质";
}

// 视频播放器和画质选择
function createVideoCard(card,item){

 const qualities=Array.isArray(item.qualities)
  ?item.qualities.filter(q=>q&&q.playUrl&&q.downloadUrl)
  :[];

 // 兼容旧接口：没有 qualities 时使用原来的地址
 const options=qualities.length
  ?qualities
  :[{
    label:item.defaultQuality||"默认画质",
    width:item.width,
    height:item.height,
    playUrl:item.playUrl||item.url,
    downloadUrl:item.downloadUrl||item.playUrl||item.url
   }];

 // 后端已按最高分辨率优先排列
 const best=options[0];

 const video=document.createElement("video");

 video.controls=true;
 video.playsInline=true;
 video.preload="metadata";
 video.setAttribute("playsinline","");
 video.setAttribute("webkit-playsinline","");

 if(item.thumbnail){
  video.poster=item.thumbnail;
 }

 const source=document.createElement("source");
 source.src=best.playUrl;
 source.type="video/mp4";

 video.appendChild(source);
 card.appendChild(video);

 video.addEventListener("error",()=>{
  showError(card,"视频加载失败，请检查网络或视频源");
 });

 // 播放画质
 const playBox=document.createElement("div");
 playBox.className="quality-box";

 const playTitle=document.createElement("div");
 playTitle.className="quality-title";
 playTitle.textContent="▶ 播放画质";

 const playBadge=document.createElement("span");
 playBadge.className="quality-badge";
 playBadge.textContent="默认最高";
 playTitle.appendChild(playBadge);

 const playSelect=document.createElement("select");

 options.forEach((q,index)=>{
  const option=document.createElement("option");
  option.value=String(index);
  option.textContent=
   qualityName(q)+
   (q.width&&q.height
    ?" · "+q.width+"×"+q.height
    :"");

  playSelect.appendChild(option);
 });

 playSelect.value="0";

 const playHint=document.createElement("div");
 playHint.className="quality-hint";
 playHint.textContent="切换后会重新加载视频，尽量保持播放进度";

 playBox.appendChild(playTitle);
 playBox.appendChild(playSelect);
 playBox.appendChild(playHint);
 card.appendChild(playBox);

 // 下载画质
 const downloadBox=document.createElement("div");
 downloadBox.className="quality-box";

 const downloadTitle=document.createElement("div");
 downloadTitle.className="quality-title";
 downloadTitle.textContent="⬇ 下载画质";

 const downloadBadge=document.createElement("span");
 downloadBadge.className="quality-badge";
 downloadBadge.textContent="默认最高";
 downloadTitle.appendChild(downloadBadge);

 const downloadSelect=document.createElement("select");

 options.forEach((q,index)=>{
  const option=document.createElement("option");
  option.value=String(index);
  option.textContent=
   qualityName(q)+
   (q.width&&q.height
    ?" · "+q.width+"×"+q.height
    :"");

  downloadSelect.appendChild(option);
 });

 downloadSelect.value="0";

 const downloadHint=document.createElement("div");
 downloadHint.className="quality-hint";
 downloadHint.textContent="下载画质和播放画质互不影响";

 downloadBox.appendChild(downloadTitle);
 downloadBox.appendChild(downloadSelect);
 downloadBox.appendChild(downloadHint);
 card.appendChild(downloadBox);

 // 当前下载地址
 const downloadButton=addButton(
  card,
  best.downloadUrl,
  "⬇ 下载 "+qualityName(best),
  true
 );

 // 当前播放画质切换
 playSelect.addEventListener("change",()=>{

  const index=Number(playSelect.value);
  const selected=options[index];

  if(!selected)return;

  const oldTime=video.currentTime||0;
  const wasPlaying=!video.paused;

  video.pause();

  source.src=selected.playUrl;
  video.load();

  video.addEventListener("loadedmetadata",function restore(){
   video.removeEventListener("loadedmetadata",restore);

   if(Number.isFinite(oldTime)&&oldTime>0){
    try{
     video.currentTime=Math.min(
      oldTime,
      video.duration||oldTime
     );
    }catch(e){}
   }

   if(wasPlaying){
    video.play().catch(()=>{});
   }
  });

 });

 // 下载画质切换
 downloadSelect.addEventListener("change",()=>{

  const index=Number(downloadSelect.value);
  const selected=options[index];

  if(!selected)return;

  downloadButton.href=selected.downloadUrl;
  downloadButton.textContent=
   "⬇ 下载 "+qualityName(selected);

 });

 // 打开当前播放画质原始视频
 addButton(
  card,
  best.url||item.url,
  "打开原始视频"
 );
}

// 图片
function createImageCard(card,item){

 const img=document.createElement("img");

 img.src=item.url;
 img.alt="推文图片";
 img.loading="lazy";

 img.onerror=()=>{
  showError(card,"图片加载失败");
 };

 card.appendChild(img);

 addButton(
  card,
  item.url,
  "打开 / 下载图片",
  true
 );
}

async function parseTweet(){

 const url=input.value.trim();
 const id=getTweetId(url);

 results.innerHTML="";

 if(!id){
  statusBox.textContent="请输入正确的 X 推文链接";
  return;
 }

 btn.disabled=true;
 statusBox.textContent="正在解析，请稍候...";

 try{

  const response=await fetch(
   API_URL+"?id="+encodeURIComponent(id)
  );

  const data=await response.json();

  if(!response.ok||data.success===false){
   throw new Error(data.error||"解析失败");
  }

  if(!Array.isArray(data.media)||data.media.length===0){
   throw new Error("没有找到媒体文件");
  }

  // 作者信息
  const info=document.createElement("div");
  info.className="panel";

  const author=document.createElement("div");
  author.textContent=
   (data.author||"")+
   (data.username?" @"+data.username:"");

  info.appendChild(author);

  if(data.text){
   const content=document.createElement("p");
   content.className="small";
   content.textContent=data.text;
   info.appendChild(content);
  }

  results.appendChild(info);

  // 媒体内容
  data.media.forEach((item,index)=>{

   const card=document.createElement("div");
   card.className="item";

   const title=document.createElement("h4");

   title.textContent=
    item.type==="video"||item.type==="gif"
    ?"视频 "+(index+1)
    :"图片 "+(index+1);

   card.appendChild(title);

   if(item.type==="video"||item.type==="gif"){
    createVideoCard(card,item);
   }else{
    createImageCard(card,item);
   }

   results.appendChild(card);
  });

  statusBox.textContent=
   "解析成功，共找到 "+data.media.length+" 个媒体文件";

  saveHistory(url);

 }catch(error){

  statusBox.textContent="解析失败："+error.message;

 }finally{
  btn.disabled=false;
 }
}

function saveHistory(url){

 let list=JSON.parse(
  localStorage.getItem("xHistory")||"[]"
 );

 list=[
  url,
  ...list.filter(x=>x!==url)
 ].slice(0,8);

 localStorage.setItem("xHistory",JSON.stringify(list));
 showHistory();
}

function showHistory(){

 const list=JSON.parse(
  localStorage.getItem("xHistory")||"[]"
 );

 const box=document.getElementById("history");
 box.innerHTML="";

 if(!list.length){
  box.textContent="暂无历史记录";
  return;
 }

 list.forEach(url=>{

  const row=document.createElement("div");
  row.className="item";

  const a=document.createElement("a");
  a.href="#";
  a.className="action";
  a.textContent=url;

  a.onclick=e=>{
   e.preventDefault();
   input.value=url;
   parseTweet();
  };

  row.appendChild(a);
  box.appendChild(row);
 });
}

showHistory();
</script>
</body>
</html>
